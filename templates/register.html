{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card fade-in">
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Join our placement community</p>
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-control">
            </div>
            
            <div class="form-group">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control" placeholder="e.g., Computer Science">
            </div>
            
            <div class="grid grid-2">
                <div class="form-group">
                    <label class="form-label">Graduation Year</label>
                    <input type="number" name="graduation_year" class="form-control" min="2024" max="2030">
                </div>
                
                <div class="form-group">
                    <label class="form-label">CGPA</label>
                    <input type="number" name="cgpa" class="form-control" step="0.01" min="0" max="10">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
        </form>
        
        <div class="text-center mt-2">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
